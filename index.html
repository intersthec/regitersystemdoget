<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฟอร์มส่งข้อมูลเข้า Google Sheet</title>
</head>

<body>
  <h1>ฟอร์มลงทะเบียน</h1>

  <!-- ฟอร์มกรอกข้อมูล -->
  <form id="myForm">
    <label>ชื่อ:</label><br>
    <input type="text" name="name" required><br><br>

    <label>อีเมล:</label><br>
    <input type="email" name="email" required><br><br>

    <label>เบอร์โทร:</label><br>
    <input type="tel" name="phone" required><br><br>

    <button type="submit" id="sub">ส่งข้อมูล</button>
  </form>

  <p id="msg"></p>

  <hr>

  <!-- ปุ่มดึงข้อมูลจำนวนทั้งหมด (ทดสอบ doGet) -->
  <button id="checkBtn">ดูจำนวนคนที่ลงทะเบียนแล้ว</button>
  <p id="countMsg"></p>

  <script>
    // ----------------------------------------------------
    // 1) วาง URL ที่ได้จากตอน Deploy Web App ตรงนี้
    // ----------------------------------------------------
    const API_URL = "https://script.google.com/macros/s/AKfycbxVxiOzGLd8Lowh2Uoo4m7kgclh2czQH29wz3HY-LtKmB5GEX-CgjeO-HRdbouM0uyT3A/exec";

    const form = document.getElementById("myForm");
    const sub = document.getElementById("sub");
    const msg = document.getElementById("msg");

    // ----- ส่งข้อมูล (เรียก doPost) -----
    form.addEventListener("submit", function (e) {
      e.preventDefault(); // ไม่ให้หน้าเว็บรีโหลด

      sub.disabled = true;
      sub.textContent = "กำลังส่ง...";

      const data = new FormData(form);

      fetch(API_URL, {
        method: "POST",
        body: data
      })
        .then(res => res.text())
        .then(text => {
          msg.textContent = text;
          form.reset();
        })
        .catch(err => {
          msg.textContent = "เกิดข้อผิดพลาด: " + err;
        })
        .finally(() => {
          sub.disabled = false;
          sub.textContent = "ส่งข้อมูล";
        });
    });

    // ----- ดึงข้อมูล (เรียก doGet) -----
    const checkBtn = document.getElementById("checkBtn");
    const countMsg = document.getElementById("countMsg");

    checkBtn.addEventListener("click", function () {
      countMsg.textContent = "กำลังโหลด...";

      fetch(API_URL) // ไม่ระบุ method = GET โดยอัตโนมัติ
        .then(res => res.text())
        .then(text => {
          countMsg.textContent = text;
        })
        .catch(err => {
          countMsg.textContent = "เกิดข้อผิดพลาด: " + err;
        });
    });
  </script>
</body>

</html>
